<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="식단">
<link rel="manifest" href="/public/manifest.webmanifest">
<link rel="apple-touch-icon" href="/public/icon-180.png">
<title>식단 캘린더</title>
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --card: #f7f8fa;
    --under: #7a5b00; --under-bg: #fdf3d8;
    --ok: #0f7b3f; --ok-bg: #e6f4ec;
    --over: #a3121b; --over-bg: #fdeaec;
    --none-fg: #9aa2ad; --none-bg: transparent;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --fg: #e8eaed; --muted: #9aa2ad;
      --line: #262a31; --card: #181b21;
      --under: #e8c25a; --under-bg: #2a2211;
      --ok: #5fd48f; --ok-bg: #12291d;
      --over: #ff8a94; --over-bg: #2b1418;
      --none-fg: #565c66; --none-bg: transparent;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    height: 100dvh; /* 100vh 금지 — iOS 주소창 때문에 잘린다 */
    overflow: hidden; /* 캘린더 한 화면에 다 들어간다 — 스크롤 필요 없음 */
    display: flex; flex-direction: column;
    padding:
      calc(env(safe-area-inset-top) + 12px)
      calc(env(safe-area-inset-right) + 10px)
      calc(env(safe-area-inset-bottom) + 12px)
      calc(env(safe-area-inset-left) + 10px);
  }

  header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  header button {
    -webkit-appearance: none; appearance: none; border: 0; background: var(--card);
    color: var(--fg); width: 40px; height: 40px; border-radius: 10px;
    font-size: 20px; line-height: 1;
  }
  #openSettings { font-size: 17px; }
  .header-right { display: flex; gap: 8px; }
  h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }

  #weekdays {
    flex: 0 0 auto;
    display: grid; grid-template-columns: repeat(7, 1fr);
    color: var(--muted); font-size: 12px; font-weight: 600;
    text-align: center; margin-bottom: 6px;
  }

  .grid {
    /* 남는 높이만큼만 차지하되(안 넘침), 셀은 늘리지 않고 위에서부터 채운다 —
       5주짜리 달이면 아래에 빈 공간이 남는다. 그걸로 됐다. */
    flex: 1 1 auto; min-height: 0; overflow: hidden;
    display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: min-content;
    align-content: start; gap: 4px;
  }
  .day {
    -webkit-appearance: none; appearance: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; aspect-ratio: 1 / 1.05; min-width: 0;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--fg); font: inherit; padding: 4px 2px;
  }
  .day-num { font-size: 13px; font-weight: 600; }
  .day-kcal { font-size: 11px; color: var(--muted); min-height: 13px; }
  .day-badge { font-size: 9px; font-weight: 700; white-space: nowrap; }

  .day-under { border-color: var(--under); background: var(--under-bg); }
  .day-under .day-badge { color: var(--under); }
  .day-ok { border-color: var(--ok); background: var(--ok-bg); }
  .day-ok .day-badge { color: var(--ok); }
  .day-over { border-color: var(--over); background: var(--over-bg); }
  .day-over .day-badge { color: var(--over); }
  .day-none .day-badge { color: var(--none-fg); }

  .day-outside { opacity: .35; }
  .day-today { box-shadow: 0 0 0 2px var(--fg) inset; }

  /* 일간 상세 시트 */
  .sheet {
    position: fixed; inset: 0; background: var(--bg); color: var(--fg);
    padding:
      calc(env(safe-area-inset-top) + 12px)
      calc(env(safe-area-inset-right) + 10px)
      calc(env(safe-area-inset-bottom) + 12px)
      calc(env(safe-area-inset-left) + 10px);
    overflow-y: auto;
  }
  .sheet[hidden] { display: none; }
  .sheet-header {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 16px; padding-bottom: 8px;
    background: var(--bg);
  }
  .sheet-header button {
    -webkit-appearance: none; appearance: none; border: 0; background: none;
    color: var(--fg); font: inherit; font-weight: 600; padding: 6px 0;
  }
  .sheet-header h2 { font-size: 16px; margin: 0; }

  .totals { margin-bottom: 20px; }
  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; margin-bottom: 8px;
  }
  .total-row b { font-size: 20px; }
  .bar {
    height: 8px; border-radius: 999px; background: var(--card);
    border: 1px solid var(--line); overflow: hidden;
  }
  .bar-fill { height: 100%; background: var(--ok); border-radius: 999px; width: 0; }

  .slots { display: flex; flex-direction: column; gap: 12px; }
  .slot {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    background: var(--card);
  }
  .slot-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .slot h3 { font-size: 14px; margin: 0; }
  .slot-add {
    -webkit-appearance: none; appearance: none; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font: inherit; font-size: 13px;
    min-height: 32px; padding: 0 12px; border-radius: 8px;
  }
  .slot-items { color: var(--muted); font-size: 13px; }
  .entry-line {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 6px 0; border-top: 1px solid var(--line); color: var(--fg);
  }
  .entry-line:first-child { border-top: 0; }
  .entry-name { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-kcal { font-size: 13px; font-weight: 600; flex: 0 0 auto; }
  .entry-del {
    -webkit-appearance: none; appearance: none; border: 0; background: none;
    color: var(--muted); font: inherit; font-size: 16px; padding: 0 2px; flex: 0 0 auto;
  }
  .macro-row {
    display: flex; gap: 12px; margin-top: 8px;
    color: var(--muted); font-size: 12px;
  }
  .save-state {
    margin-top: 14px; font-size: 12px; color: var(--muted);
    text-align: center;
  }
  .save-state.pending { color: var(--under); }
  .save-state.failed { color: var(--over); font-weight: 600; }

  /* 목표 설정 폼 */
  .profile-form { display: flex; flex-direction: column; gap: 14px; }
  .profile-form label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .profile-form input, .profile-form select {
    -webkit-appearance: none; appearance: none;
    font: inherit; font-size: 16px; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .calc-note { color: var(--muted); font-size: 12px; margin: 0; line-height: 1.5; }
  .checkbox-row {
    flex-direction: row !important; align-items: center; gap: 8px !important;
    font-weight: 500 !important; color: var(--fg) !important;
  }
  .checkbox-row input { width: auto; }

  .ghost-btn {
    -webkit-appearance: none; appearance: none;
    border: 1px solid var(--line); background: none; color: var(--fg);
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px;
    margin-left: auto;
  }
  .quick-section { margin-bottom: 16px; }
  .quick-section h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 8px 8px 8px 14px; font-size: 13px;
  }
  .chip-add {
    -webkit-appearance: none; appearance: none; border: 0; background: none;
    color: var(--fg); font: inherit; font-size: 13px; font-weight: 600;
  }
  .chip-del {
    -webkit-appearance: none; appearance: none; border: 0; background: none;
    color: var(--muted); font-size: 15px; line-height: 1; padding: 2px 4px;
  }
  .form-error {
    color: var(--over); background: var(--over-bg); border: 1px solid var(--over);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
  }
  .form-result {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; font-size: 13px; line-height: 1.7;
  }
  .form-result b { font-size: 15px; }
  .manual-ratio {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.6;
  }

  .search-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .search-row input {
    flex: 1 1 auto; -webkit-appearance: none; appearance: none;
    font: inherit; font-size: 16px; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .search-row button {
    -webkit-appearance: none; appearance: none; border: 0;
    background: var(--fg); color: var(--bg); font: inherit; font-weight: 600;
    font-size: 14px; padding: 0 16px; border-radius: 10px;
  }
  .search-status { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .search-results { display: flex; flex-direction: column; gap: 6px; }
  .search-result {
    -webkit-appearance: none; appearance: none; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 10px 12px; font: inherit; color: var(--fg);
  }
  .search-result .r-name { font-size: 13px; font-weight: 600; display: block; }
  .search-result .r-meta { font-size: 12px; color: var(--muted); }

  .portion-prompt label {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .portion-prompt input {
    -webkit-appearance: none; appearance: none; font: inherit; font-size: 16px;
    color: var(--fg); background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  .portion-prompt .form-result { margin-bottom: 14px; }
  #confirmPortion {
    -webkit-appearance: none; appearance: none; border: 0; width: 100%;
    min-height: 48px; font: inherit; font-weight: 600; font-size: 16px;
    color: var(--bg); background: var(--fg); border-radius: 12px;
  }
  .profile-form button[type="submit"] {
    -webkit-appearance: none; appearance: none; border: 0;
    min-height: 48px; font: inherit; font-weight: 600; font-size: 16px;
    color: var(--bg); background: var(--fg); border-radius: 12px;
  }

  /* 모바일 기본: 래퍼가 레이아웃에 안 끼어든다 */
  #app { display: contents; }
  .sheet-inner { display: contents; }

  /* 데스크톱 — 가운데 카드형 레이아웃. 폰만 "한 화면 고정"이고 여긴 일반 스크롤 허용 */
  @media (min-width: 820px) {
    body {
      height: auto; min-height: 100vh; overflow: auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--line);
      padding: 40px 20px;
    }
    #app {
      display: flex; flex-direction: column;
      width: 100%; max-width: 640px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 16px;
      padding: 28px; box-shadow: 0 10px 40px rgba(0, 0, 0, .12);
    }
    .day-num { font-size: 15px; }
    .day-kcal { font-size: 12px; }
    .day-badge { font-size: 10px; }

    .sheet {
      background: rgba(16, 18, 22, .5);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .sheet-inner {
      display: block;
      width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto;
      background: var(--bg); border-radius: 16px; padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    }
  }
</style>
</head>
<body>

<main id="app">
<header>
  <button id="prevMonth" aria-label="이전 달">‹</button>
  <h1 id="monthLabel"></h1>
  <div class="header-right">
    <button id="openSettings" aria-label="목표 설정">⚙</button>
    <button id="nextMonth" aria-label="다음 달">›</button>
  </div>
</header>

<div id="weekdays">
  <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
</div>

<div id="grid" class="grid"></div>
</main>

<div id="dayDetail" class="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-header">
      <button id="closeDetail" aria-label="캘린더로 돌아가기">‹ 캘린더</button>
      <h2 id="detailDate"></h2>
      <button id="copyYesterday" class="ghost-btn" type="button">어제 복사</button>
    </div>
    <div class="totals">
      <div class="total-row"><span>칼로리</span><b id="totalKcal">0 / 0 kcal</b></div>
      <div class="bar"><div class="bar-fill" id="kcalBar"></div></div>
      <div class="macro-row" id="macroRow"></div>
    </div>
    <div class="slots" id="slots"></div>
    <div id="saveState" class="save-state" hidden></div>
  </div>
</div>

<div id="entryForm" class="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-header">
      <button id="closeEntry" aria-label="돌아가기">‹ 뒤로</button>
      <h2 id="entryTitle">항목 추가</h2>
    </div>

    <div id="entryChooser">
    <div class="quick-section">
      <h3>식약처 검색</h3>
      <form id="foodSearchForm" class="search-row">
        <input id="searchInput" type="text" placeholder="예: 닭가슴살" autocomplete="off">
        <button type="submit">검색</button>
      </form>
      <div id="searchStatus" class="search-status" hidden></div>
      <div id="searchResults" class="search-results"></div>
    </div>

    <div id="quickPresets" class="quick-section" hidden>
      <h3>프리셋</h3>
      <div id="presetChips" class="chip-row"></div>
    </div>
    <div id="quickRecent" class="quick-section" hidden>
      <h3>최근 항목</h3>
      <div id="recentChips" class="chip-row"></div>
    </div>

    <form id="manualEntryForm" class="profile-form">
      <label>이름
        <input name="name" type="text" required placeholder="직접 입력">
      </label>
      <label>양 (g)
        <input name="amountG" type="number" inputmode="decimal" min="0" step="0.1" required>
      </label>
      <p class="calc-note">
        아래 4개는 <b>먹은 양 전체</b>의 값이다 (100g 기준 아님).
        모르는 값은 비워두지 말고 포장지·조회 결과에서 확인해 넣는다 —
        추정치로 채우면 기록이 거짓이 된다.
      </p>
      <label>칼로리 (kcal)
        <input name="kcal" type="number" inputmode="decimal" min="0" step="0.1" required>
      </label>
      <label>탄수화물 (g)
        <input name="carbG" type="number" inputmode="decimal" min="0" step="0.1" required>
      </label>
      <label>단백질 (g)
        <input name="proteinG" type="number" inputmode="decimal" min="0" step="0.1" required>
      </label>
      <label>지방 (g)
        <input name="fatG" type="number" inputmode="decimal" min="0" step="0.1" required>
      </label>
      <label class="checkbox-row">
        <input name="saveAsPreset" type="checkbox">
        프리셋으로 저장 (다음에 1탭으로 추가)
      </label>
      <div id="entryError" class="form-error" hidden></div>
      <button type="submit">추가</button>
    </form>
    </div>

    <div id="portionPrompt" class="portion-prompt" hidden>
      <div class="sheet-header">
        <button id="cancelPortion" type="button" aria-label="검색 결과로 돌아가기">‹ 검색 결과</button>
        <h2 id="portionTitle"></h2>
      </div>
      <label>양 (g)
        <input id="portionAmount" type="number" inputmode="decimal" min="0" step="0.1" value="100">
      </label>
      <div id="portionPreview" class="form-result"></div>
      <button id="confirmPortion" type="button">이 양으로 추가</button>
    </div>
  </div>
</div>

<div id="settings" class="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-header">
      <button id="closeSettings" aria-label="캘린더로 돌아가기">‹ 캘린더</button>
      <h2>목표 설정</h2>
    </div>
    <div id="manualRatio" class="manual-ratio" hidden></div>
    <form id="profileForm" class="profile-form">
      <label>성별
        <select name="sex" required>
          <option value="male">남성</option>
          <option value="female">여성</option>
        </select>
      </label>
      <label>키 (cm)
        <input name="heightCm" type="number" inputmode="decimal" min="100" max="250" step="0.1" required>
      </label>
      <label>체중 (kg)
        <input name="weightKg" type="number" inputmode="decimal" min="20" max="300" step="0.1" required>
      </label>
      <label>태어난 연도
        <input name="birthYear" type="number" inputmode="numeric" min="1906" max="2016" step="1" required>
      </label>
      <label>주간 운동 횟수
        <select name="weeklyWorkouts" required>
          <option value="0">0회</option>
          <option value="1">1회</option>
          <option value="2">2회</option>
          <option value="3">3회</option>
          <option value="4">4회</option>
          <option value="5">5회</option>
          <option value="6">6회</option>
          <option value="7">7회</option>
        </select>
      </label>
      <label>목적
        <select name="goal" required>
          <option value="diet">다이어트 (TDEE − 15%)</option>
          <option value="leanbulk">린매스업 (TDEE + 5%)</option>
          <option value="bulk">벌크업 (TDEE + 15%)</option>
        </select>
      </label>

      <p class="calc-note">공식(Mifflin-St Jeor)의 추정치다. 의학적 권고가 아니다 — 결과가 이상하면 직접 조정해도 된다.</p>
      <div id="formError" class="form-error" hidden></div>
      <div id="formResult" class="form-result" hidden></div>

      <button type="submit">계산하고 저장</button>
    </form>
  </div>
</div>

<script type="module" src="/public/app.js"></script>
</body>
</html>
